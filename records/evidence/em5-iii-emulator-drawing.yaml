- type: evidence
  id: evidence.em5-iii-emu-c3d-stock
  title: 'E-M5 III 1.7 in om-emu: stock c3d screens drawn'
  summary: "With the notes' patches, om-emu shows the vector-GPU layer and the camera's own c3d code draws the stock Color Creator, ART carousel and Part Color screens."
  source_refs:
  - source.em5n.c3d-gpu
  - source.em5n.tool-omemu-c3d
  topics:
  - emulation
  last_reviewed: '2026-11-21'
  camera_id: camera.em5-iii
  firmware_id: firmware.em5-iii-1700
  project_id: project.em5-iii-notes
  mod_build: notes' om-emu patch set (2026-11-21)
  method: emulator
  provenance: maintainer-summary
  identity_level: not-applicable
  package_sha256: null
  expected_package_sha256: null
  outcome: reported-pass
  quality: partial
  reported_on: '2026-11-21'
  tested_on: '2026-11-21'
  procedure: "om-emu E137 with the notes' patches applied; the stock screens opened from the emulated menus and turned with the emulated dials; frames captured from the composited display."
  coverage:
  - "Stock Color Creator wheel drawn and redrawn as it turns."
  - "ART carousel and Part Color ring drawn by the camera's own c3d code."
  limitations:
  - "Emulator only; om-emu does not model the GPU, so drawing goes through a JavaScript OpenVG stand-in."
  - "The ART band height differs from the camera (about 80 px in om-emu, about 120 px on the camera, from an owner photo)."
  - "Not a camera test."
  assumptions: []
  emulator:
    url: https://github.com/flatpanda/om-emu
    revision: ccfe2e0
    model: E137
    stand_ins:
    - The notes' om-emu patches (IMG plane compositing, generated live-view backdrop)
    - A JavaScript OpenVG stand-in for the camera's GPU library (c3d runner)
