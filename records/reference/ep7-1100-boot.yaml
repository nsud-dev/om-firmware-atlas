- type: reference
  id: reference.ep7-1100.evf-gamma-tables
  title: Dead EVF gamma tables
  summary: EVF gamma tables in section 1 that the E-P7, which has no EVF, never programs.
  source_refs:
  - source.ep7.guide
  topics:
  - patching
  last_reviewed: '2026-11-18'
  category: free-space
  camera_ids:
  - camera.ep7
  firmware_ids:
  - firmware.ep7-1100
  address:
    space: runtime-cached
    value: '0x601de13c'
    end: '0x601e3b3c'
  note: Only the EVF device path reaches them. Do not reuse this range on a body with an EVF. Step-table words at
    0x601e3b40..0x601e3d68 point into it.
  observations:
  - method: static-analysis
    source_ref: source.ep7.guide
    project_id: project.caduceus-ep7
    summary: One step-table word points to each 256-byte table; the programmer runs only for the EVF.
  - method: physical-camera
    source_ref: source.ep7.guide
    project_id: project.caduceus-ep7
    summary: Code placed in these tables has run on the camera since test 11.
  conflicts: []
  upstream_detail: https://github.com/cakelesscoder/caduceus-ep7/blob/0cb1dbcc50595cd87f56648810762ffbbb8e17f3/docs/FIRMWARE_GUIDE.md#2-the-main-program
- type: reference
  id: reference.ep7-1100.firmup-cli
  title: Card updater task
  summary: 'Task 88 FIRMUP_CLI: picks the DCOLYMP E142????.BIN with the largest suffix above 0.'
  source_refs:
  - source.ep7.guide
  topics:
  - patching
  last_reviewed: '2026-11-18'
  category: function
  camera_ids:
  - camera.ep7
  firmware_ids:
  - firmware.ep7-1100
  address:
    space: runtime-cached
    value: '0x60c95bab'
  note: E1429999.BIN is chosen and E1420000.BIN never is. FIRMUP_SRV starts only after section 2 has loaded, so
    an early boot fault could make the updater unreachable.
  observations:
  - method: emulator
    source_ref: source.ep7.guide
    project_id: project.caduceus-ep7
    summary: File selection verified in the emulator.
  - method: physical-camera
    source_ref: source.ep7.guide
    project_id: project.caduceus-ep7
    summary: Recovered the E-P7 once from a boot loop.
  conflicts: []
  upstream_detail: https://github.com/cakelesscoder/caduceus-ep7/blob/0cb1dbcc50595cd87f56648810762ffbbb8e17f3/docs/FIRMWARE_GUIDE.md#1-the-firmware-package
