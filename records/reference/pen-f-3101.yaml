  id: reference.pen-f-3101.section-load-request
  title: Section load request
  summary: Requests a section load; USTART1 calls it for section 3, which then crosses to CPU1.
  source_refs:
  - source.fishcu.pen-f-functions
  topics:
  - patching
  - platform
  last_reviewed: '2026-11-18'
  category: function
  camera_ids:
