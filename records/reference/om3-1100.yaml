- type: reference
  id: reference.om3-1100.hue-lightness-call
  title: Hue/lightness builder call site
  summary: Where the colour stage calls the hue/lightness builder; Caduceus hooks here.
  source_refs:
  - source.om3.devnotes
  - source.emu.caduceus-om3
  topics:
  - colour
  - patching
  last_reviewed: '2026-11-18'
  category: hook-site
  camera_ids: &id001
  - camera.om3
  firmware_ids: &id002
  - firmware.om3-1100
  address:
    space: runtime-cached
    value: '0x60518615'
  note: A single call into the builder at 0x60518381; execution resumes at 0x6051861a. Runtime addresses
    are the decoded main plus 0x60021020.
