  id: reference.om3-1100.section-1-tail
  title: Section 1 free tail
  summary: Unused 0xFF bytes at the end of section 1, which loads first.
  source_refs:
  - source.om3.devnotes
  - source.fishcu.code-space
  topics:
  - patching
  last_reviewed: '2026-11-18'
  category: free-space
  camera_ids: *id001
  firmware_ids: *id002
  address:
    space: runtime-cached
    value: '0x6031e910'
    end: '0x6031f000'
  note: Caduceus uses 0x6031e920 to 0x6031ebf0. Other projects should check its code-space use before
    claiming bytes here.
  observations:
  - method: physical-camera
    source_ref: source.om3.devnotes
    project_id: project.caduceus-om3
    summary: Caduceus code in this range runs on the camera, per the OM-3 developer notes.
  - method: static-analysis
    source_ref: source.fishcu.code-space
    project_id: project.oly-fw-analysis
    summary: 'FF suffix 0x6031e910..0x6031f000 lies inside the loaded range 0x60134000..0x6031f000.'
  - method: emulator
    source_ref: source.fishcu.code-space
    project_id: project.oly-fw-analysis
    summary: 'Native load and reload tests keep added bytes here under modelled storage.'
