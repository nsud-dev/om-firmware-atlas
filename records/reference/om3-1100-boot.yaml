- type: reference
  id: reference.om3-1100.interrupt-lock
  title: Lock (masks interrupts)
  summary: Firmware lock; with d0 = 0 it sets the PSW interrupt mask to 0 until the unlock.
  source_refs:
  - source.om3.notes
  - source.emu.caduceus-om3
  topics:
  - patching
  - platform
  last_reviewed: '2026-11-18'
  category: function
  camera_ids:
  - camera.om3
  firmware_ids:
  - firmware.om3-1100
  address:
    space: runtime-cached
    value: '0x60075f73'
  note: The unlock is at 0x60075fbc. Work done between lock and unlock runs with interrupts masked; see the hazard
    on keeping that window short.
  observations:
  - method: static-analysis
    source_ref: source.om3.notes
    project_id: project.caduceus-om3
    summary: LOCK with d0 = 0 sets the PSW interrupt mask to 0.
  - method: emulator
    source_ref: source.emu.caduceus-om3
    project_id: project.om-emu
    summary: Runs as stock in the lab; only its interrupt-mask half takes effect there.
