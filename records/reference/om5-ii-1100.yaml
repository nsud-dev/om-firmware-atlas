  address:
    space: runtime-cached
    value: '0x600284fc'
  note: 'Use these bounds, not 0xFF runs, to place code: section 5 ends 4 KiB before section 6 starts.'
  observations:
  - method: static-analysis
    source_ref: source.om5.startup-fix
    project_id: project.caduceus-om5
    summary: Read with the end selector to give section 5 as 0x60843000..0x60846000.
