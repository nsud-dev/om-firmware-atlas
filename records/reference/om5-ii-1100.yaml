  id: reference.om5-ii-1100.section-table
  title: Section descriptor table
  summary: Native descriptor table; with the end selector at 0x600463af it fixes each section's loaded range.
  source_refs:
  - source.om5.startup-fix
  topics:
  - patching
  - platform
  last_reviewed: '2026-11-18'
