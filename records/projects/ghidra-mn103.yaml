  tagline: Read MN103 camera firmware in Ghidra, with the decompiler.
  description:
  - A Ghidra processor module for the Panasonic MN103 family (MN10300, AM33, AM33-2), language ID MN103:LE:32:AM33-2.
    Disassembly matches GNU objdump instruction for instruction; the SLEIGH spec is generated from the binutils
    opcode table.
  - The decompiler handles the MN103's caller-built call frames, hardware loops and calling convention. Scripts load
    symbols, fix call frames, recover switch tables and batch-decompile. Tested with Ghidra 11.4.2 on Java 21; CI also
    builds on the newest Ghidra release.
