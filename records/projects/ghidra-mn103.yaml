  status_summary: Built and checked against E-M5 III 1.7 block 0. Nothing in the module is camera-specific;
    it applies to any body whose main CPU is MN103 (AM33-2).
  related_projects:
  - project.em5-iii-notes
  tagline: Read MN103 camera firmware in Ghidra, with the decompiler.
  description:
  - A Ghidra processor module for the Panasonic MN103 family (MN10300, AM33, AM33-2), language ID MN103:LE:32:AM33-2.
    Disassembly matches GNU objdump instruction for instruction; the SLEIGH spec is generated from the
    binutils opcode table.
  - The decompiler handles caller-built call frames and hardware loops. Its helper scripts load symbols,
    recover switch tables and batch-decompile. Upstream reports testing with Ghidra 11.4.2 on Java 21
    and Ghidra 12.2 on Java 25.
