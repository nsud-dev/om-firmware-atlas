  - name: Pointer-register calling convention
    summary: The optional ptrregs compiler spec places typed pointer arguments in the MN103 address registers.
      Upstream CI checks argument placement. The maintainer reports the same final decompilation check counts
      with Ghidra 11.4.2 and 12.2.
    camera_ids: *id001
