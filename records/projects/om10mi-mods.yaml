  tagline: Film looks, a colour wheel, colour editors and a longer video limit for the original OM-D E-M10.
  description:
  - om10mi-mods adds firmware features to the Olympus OM-D E-M10 Mark I (E113) on firmware 1.4. Version 87 has
    18 film looks, each with its own colour matrix, tone curve and icon, a PEN-F-style colour wheel in Color
    Creator, a per-sector Hue, Saturation and Lightness editor for 12 colours, a per-look colour editor, looks in
    RAW Data Edit Custom1 and Custom2, and a video recording limit raised from 29:59 to 59:50.
  - The repository holds no firmware. A builder downloads the official 1.4 file from OM Digital Solutions after
    the user accepts its licence, applies a list of edits, and refuses to write anything unless the result
    matches the published SHA-1. It also writes a copy of the stock file for going back through the card update.
  - The look data is numbers fitted to Fujifilm film-simulation, spektrafilm, HaldCLUT and Spectral Film LUT
    references; no LUT files are shipped. Caduceus for the E-P7 is credited as the design reference for the look
    editor and the colour-wheel idea, and the oly_fw_analysis notes for the image-processing map. Everything was
    made and tested on the author's one camera body.
  - "DEVELOPMENT.md describes how changes are checked before a camera trial: a byte comparison against the last
    passing image, censuses of references and runtime-written memory, emulation of the camera's own key and paint
    routes with negative controls, deliberately broken images, and two independent audits. The emulator and
    harness are to be published later."
  goals:
  - Importing a LUT, .cube or .xmp file into a chosen look slot as an approximate look (colour matrix, tone curve
    and per-sector colour), previewed on the PC first.
  - Publishing the generic firmware tools (splitter, decoder, MN10300 emulator, census, byte oracle), with the GPL
    disassembler kept separate.
