    summary: Recording limit raised from 29:59 to 59:50; one file is still capped at 4 GB, so high bit rates can
      stop earlier. Recording past 30 minutes is not yet confirmed.
    camera_ids: *id001
    status: released
    since: v56
    source_ref: source.om10mi.readme
  - name: Colour wheel
    summary: PEN-F-style wheel in Color Creator at the ART dial; mark one or more of 12 sectors and set Hue,
      Saturation and Lightness from -7 to +7 with a live preview that matches the JPEG; kept after power-off. The
      ART dial no longer reaches the stock art filters.
