  features:
  - name: Card-loaded plugins
    summary: A one-time loader patch runs FENYKL.BIN from the card on power-switch and battery-connect boots. Without a
      valid file the camera runs as stock; OK held at power-on runs no payload.
    camera_ids: &id001
    - camera.em10-ii
    status: testing
    source_ref: source.fenykl.sdk
    capability_id: capability.em10-ii-fenykl-loader
  - name: Settings tab L in the Custom menu
    summary: A native twelfth Custom menu tab, drawn and edited by the stock menu code; values are saved to the card
      two seconds after a change.
    camera_ids: *id001
    status: testing
    source_ref: source.fenykl.ui
    capability_id: capability.em10-ii-fenykl-settings-tab
  - name: Pre-capture
    summary: A half press in silent sequential H starts the burst and keeps the latest 6 frames; the full press
      records them. Needs flash off, long-exposure NR off and S-AF or MF.
    camera_ids: *id001
    status: testing
    source_ref: source.fenykl.precap
  - name: Focus distance, depth of field and focus meter
    summary: The focus distance and depth of field the camera writes to EXIF, and a contrast bar, on the live-view
      INFO screens, also in MF.
    camera_ids: *id001
    status: testing
    source_ref: source.fenykl.afc
  - name: Battery percentage
    summary: An estimated percentage replaces the stock battery icon on the INFO screens.
    camera_ids: *id001
    status: testing
    source_ref: source.fenykl.readme
  - name: R/B swap
    summary: Swaps the red and blue channels, for infrared photography.
    camera_ids: *id001
    status: testing
    source_ref: source.fenykl.readme
  - name: Screenshot button
    summary: A Button Function entry for Fn1, Fn2, Fn3, REC or L-Fn that saves the live view as SHOTnnnn.PPM to the
      card root.
    camera_ids: *id001
    status: testing
    source_ref: source.fenykl.fnfunc
  - name: Wi-Fi dev monitor
    summary: An opt-in plugin that opens the camera's access point for memory reads and writes, small test programs,
      card files and screen capture from a PC.
    camera_ids: *id001
    status: testing
    source_ref: source.fenykl.devmon
