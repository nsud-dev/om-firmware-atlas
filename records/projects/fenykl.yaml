  status_summary: No release; the README calls it an early-stage experimental project, not ready for care-free users.
    The maintainer runs the loader and the main plugin on one E-M10 Mark II on firmware 1.4; the SDK's status table
    dates each camera run and names the parts that ran only in its simulator.
  tagline: A loader flashed once, then plugins written in C from the SD card. E-M10 Mark II.
  description:
  - fenykl is a firmware mod infrastructure for the Olympus OM-D E-M10 Mark II on body firmware 1.4. The camera is
    flashed once with a small loader patch; from then on the loader runs FENYKL.BIN from the SD card at boot, and
    without the file the camera behaves as stock.
  - Plugins are written in C against an SDK that calls and hooks firmware functions. The main plugin adds focus
    distance, depth of field, a focus meter and a battery percentage to the live-view INFO screens, an R/B swap,
    pre-capture and a screenshot button, with its settings in a native Custom menu tab.
