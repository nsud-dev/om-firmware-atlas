  status_summary: Release v0.1.0 (2026-11-20) for the OM-5 Mark II on firmware 1.1. The developers report the loader
    patch running on their camera since 2026-10-30 and starting core on every full power-on. Wi-Fi and USB start paths
    are not verified, and the project calls itself young software.
  related_projects:
  - project.caduceus-om5
  tagline: A loader flashed once, then core, modules and settings from the SD card. OM-5 Mark II.
  description:
  - OMKit is a modular custom firmware for the OM SYSTEM OM-5 Mark II on firmware 1.1. It takes a different route
    from the other mods in the Atlas. The camera is flashed once with a small loader patch, and from then on the
    OMKit core, its modules, their updates and all their settings live in an OMKIT folder on the SD card. Adding,
    updating or removing a module means copying files, not reflashing.
  - The patch is one 5-byte hook late in startup, after the live picture is shown. It only starts a low-priority task.
    That task waits for the firmware's sections, skips everything if OK is held, reads OMKIT\CORE.BIN, checks its
    header and checksum, and jumps into it. Core then checks the firmware's fingerprint and loads the modules listed
    in OMKIT.INI. With no card or no file, the camera runs as stock.
  - The first release has two modules. CREATPRF shows the three Color and three Monochrome Profiles the firmware
    hides and applies them from memory. FILMLOOK replaces one picture mode with a film look whose presets are .ISP
    files on the card, with 32 bundled. A module SDK and three PC programs for making presets come with it. The
    documentation labels each finding as code, emulator, camera, inference or assumption.
  goals:
  - Support more cameras and firmware versions with a new driver and loader per build; core, the SDK and modules
    stay the same.
  - Modules from other authors, written against the published SDK.
