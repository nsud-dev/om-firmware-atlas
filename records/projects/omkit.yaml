    camera_ids: *id001
    status: released
    since: v0.1.0
    source_ref: source.omkit.architecture
  - name: Preset programs
    summary: ISP player, ISP fitter (.cube look to preset) and ISP neurofit (preset from RAW files and film scans,
      driven by an AI agent), run on a computer.
    camera_ids: *id001
    status: released
    since: v0.1.0
