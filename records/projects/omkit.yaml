    capability_id: capability.om5-ii-omkit-loader
  - name: Creative profiles (CREATPRF)
    summary: Three colour and three monochrome profiles in the picture mode strip, edited in the camera's own column
      (12-sector saturation, tone curve, filter, toning, grain); applied to stills, live view and video.
    camera_ids: *id001
    status: released
    since: v0.1.0
    source_ref: source.omkit.creatprf
  - name: Film look (FILMLOOK)
    summary: One picture mode, i-Enhance by default, becomes a film look; the dials step through .ISP presets on the
      card, 32 bundled, with a tone curve per preset and grain on stills.
    camera_ids: *id001
    status: released
    since: v0.1.0
