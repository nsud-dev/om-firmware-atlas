  features:
  - name: Card-loaded core and modules
    summary: A one-time loader patch starts OMKIT\CORE.BIN from the card on every power-on. Updates are file copies;
      no card, or OK held at power-on, gives a stock camera.
    camera_ids: &id001
    - camera.om5-ii
    status: released
    since: v0.1.0
