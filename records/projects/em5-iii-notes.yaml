records:
- type: project
  id: project.em5-iii-notes
  title: Oly Firmware Notes and Mods (E-M5 Mark III)
  summary: Tagged technical notes on E-M5 III 1.7 firmware and hardware, with OM-5 donor feature ports.
  source_refs:
  - source.em5n.readme
  - source.em5n.overview
  - source.em5n.live-nd
  - source.em5n.focus-patch
  - source.em5n.webcam
  - source.em5n.guides
  - source.em5n.guide-drawing
  - source.em5n.guide-own-graphics
  - source.em5n.guide-vector-gpu
  - source.em5n.tool-osdlab
  - source.em5n.tool-c3d-vg
  - source.em5n.tool-omemu-c3d
  - source.em5n.card-mods
  - source.em5n.display-controller
  - source.em5n.is-controller
  topics:
  - platform
  - patching
  - tooling
  - capture
  last_reviewed: '2026-11-23'
  url: https://github.com/nsud-dev/olympus-firmware-notes
  kind: research
  camera_ids:
  - camera.em5-iii
  contribution_home: https://github.com/nsud-dev/olympus-firmware-notes/issues
  status_summary: Notes and tools only; no firmware or builds are published. Every claim is tagged [camera], [code]
    or [inferred]. Camera results come from one E-M5 III.
  related_projects:
  - project.ghidra-mn103
  - project.oly-fw-analysis
  - project.om-emu
  tagline: How the E-M5 Mark III firmware works, and bringing OM-5 features to it.
  camera_notes:
  - camera_id: camera.em5-iii
    note: "Notes and tools only; no builds are published. The author's own test builds on one E-M5 III cover focus stacking with any lens, Live ND and its live-view preview ported from the OM-5, a Color / Monochrome Profile editor, card mods loaded from the SD card, display view assists, and a parked USB webcam. Drawing your own screens and GPU graphics is so far shown in the om-emu emulator only."
  description:
  - 'A study of the Olympus OM-D E-M5 Mark III firmware 1.7: container format, boot and section loading, recovery,
    the MN103 CPU, memory map, image engine, ARM co-processor, display, stabiliser, shooting sequencer, settings and
    menus, with comparisons against the OM-5, OM-5 II, E-M1 III, OM-1 and PEN-F.'
  - The aim is to run features of newer bodies on the E-M5 III, mainly Live ND and Handheld High Res from the OM-5.
    Each page tags claims as seen on the camera, read in the code, or inferred, and gives dates.
  - 'Tools: olyfw.py unpacks and repacks E-M5 III update files and fixes their checksums; ptpinfo.py reads PTP device
    info; osdlab, c3d_vg and a set of om-emu patches (with om-emu''s MIT notice) draw on the GUI layers and the
    vector GPU in the om-emu emulator. No firmware images, disassembly or patched builds are included.'
  maintainers:
  - label: nsud-dev
    url: https://github.com/nsud-dev
  links:
  - label: Notes website
    url: https://nsud-dev.github.io/olympus-firmware-notes/
  - label: Firmware guides
    url: https://github.com/nsud-dev/olympus-firmware-notes/blob/4ee043ec5fd30b42b56d029c70c3fed6f2e8077a/docs/guides/README.md
  - label: Overview of everything studied
    url: https://github.com/nsud-dev/olympus-firmware-notes/blob/main/docs/overview.md
  - label: Gotchas
    url: https://github.com/nsud-dev/olympus-firmware-notes/blob/main/docs/reference/gotchas.md
  features:
  - name: Focus stacking with any lens
    summary: A two-byte change to the lens check lets any lens that passes the lens-type check use in-camera focus
      stacking.
    camera_ids:
    - camera.em5-iii
    status: research
    since: null
    source_ref: source.em5n.focus-patch
    capability_id: capability.em5-iii-focus-stacking-any-lens
  - name: Live ND (port from the OM-5)
    summary: A full Live ND shot from one press, ND2 to ND16, merged by the OM-5's image-engine job 11, with a
      Noise Reduction dark pass at low ISO, in test builds on one camera. Builds are not published.
    camera_ids:
    - camera.em5-iii
    status: research
    since: null
    source_ref: source.em5n.live-nd
    capability_id: capability.em5-iii-live-nd
  - name: Live ND live-view simulation (port from the OM-5)
    summary: Live view shows the Live ND blur, averaged over up to 240 frames by the OM-5's job 12, with restarts on
      shutter changes and movement, in test builds.
    camera_ids:
    - camera.em5-iii
    status: research
    since: null
    source_ref: source.em5n.live-nd
    capability_id: capability.em5-iii-live-nd-preview
  - name: Color / Monochrome Profile editor
    summary: The hidden Color and Monochrome Profile modes made selectable, with an on-camera editor (E-M1 III
      wheel routines relocated, a side bar of rows, a per-profile tone curve with the live histogram, hue,
      saturation and lightness per colour) whose edits show in live view and photos, in test builds. A free
      five-point tone curve works in the emulator and is still being finished on the camera.
    camera_ids:
    - camera.em5-iii
    status: research
    since: null
    source_ref: source.em5n.profiles
    capability_id: capability.em5-iii-profile-editor
  - name: Drawing your own graphics (GUI layers)
    summary: How to draw boxes, curves, pictures, camera-font text, see-through palettes and animation on the GUI
      layers with the camera's own calls; checked in the om-emu emulator, with the osdlab script.
    camera_ids:
    - camera.em5-iii
    status: research
    since: null
    source_ref: source.em5n.guide-own-graphics
  - name: Drawing with the vector GPU (c3d / OpenVG)
    summary: The camera's OpenVG library and c3d driver mapped; own renderers written in C run in om-emu, which
      now shows the GPU layer through our patches and a JavaScript OpenVG stand-in. Not run on a camera yet.
    camera_ids:
    - camera.em5-iii
    status: research
    since: null
    source_ref: source.em5n.guide-vector-gpu
  - name: Card mods
    summary: The firmware is flashed once with a small loader; after that, features are files on the SD card, checked
      before they run, each with an On/Off row on a Custom Menu page. Holding OK at power-on skips them. In test
      builds on one camera; the loader is not released.
    camera_ids:
    - camera.em5-iii
    status: research
    since: null
    source_ref: source.em5n.card-mods
  - name: Display view assists
    summary: View assists through the display controller's gamma, a red night view and an RGB clipping view, work
      as card mods on the camera; zebras need a driver hook. The 422 controller registers are mapped.
    camera_ids:
    - camera.em5-iii
    status: research
    since: null
    source_ref: source.em5n.display-controller
  - name: Image-stabiliser controller
    summary: The stabiliser runs on a separate chip with two MN10300-family cores; its program, command handlers,
      servo and gyro rates are read from the update file, with the OM-5 version compared.
    camera_ids:
    - camera.em5-iii
    status: research
    since: null
    source_ref: source.em5n.is-controller
  - name: USB webcam (parked)
    summary: Test builds enumerate as a UVC webcam and stream a generated picture; live view over USB failed, so the
      work is parked.
    camera_ids:
    - camera.em5-iii
    status: research
    since: null
    source_ref: source.em5n.webcam
    capability_id: capability.em5-iii-uvc-webcam
  - name: Firmware and hardware notes
    summary: Tagged, dated pages on the container, boot, recovery, CPU, memory map, image engine, ARM side, display,
      stabiliser, settings and menus.
    camera_ids:
    - camera.em5-iii
    status: research
    since: null
    source_ref: source.em5n.overview
  - name: Firmware modification techniques
    summary: Twenty-one techniques from the E-M5 III 1.7 work, each with its method, pitfalls and a per-camera
      checked-on table that credits other projects' results.
    camera_ids:
    - camera.em5-iii
    status: research
    since: null
    source_ref: source.em5n.patching
  - name: Firmware process guides
    summary: Walk through E-M5 III 1.7 boot, button input, shooting, live view, updates and frame pools,
      with links into the reference notes.
    camera_ids:
    - camera.em5-iii
    status: research
    since: null
    source_ref: source.em5n.guides
