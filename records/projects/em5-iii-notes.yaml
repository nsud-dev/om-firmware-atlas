    caption: Editing a colour profile, in the om-emu emulator with our c3d patches. The hue, saturation and lightness
      row and the free tone curve are our own additions. In the emulator the curve type and the raised points were
      set by writing the settings directly, because two dial steps don't work there.
    credit: olympus-firmware-notes; om-emu by its contributors (MIT); generated backdrop, no photo
  - path: assets/projects/em5-iii-notes/mods-page-switches.webp
