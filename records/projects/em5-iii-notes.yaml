    credit: olympus-firmware-notes; om-emu by its contributors (MIT); generated backdrop, no photo
  - path: assets/projects/em5-iii-notes/live-nd-page.webp
    alt: A menu page titled Live ND Shooting with rows Live ND Shooting On, ND Number ND8 and LV Simulation Off
    caption: The Live ND page added to the shooting menu by the port, in the om-emu emulator.
    credit: olympus-firmware-notes; om-emu by its contributors (MIT); generated backdrop, no photo
