  description:
  - 'fishcu''s Olympus firmware research is a shared notebook and toolkit for studying and modifying Olympus
    and OM SYSTEM firmware: update files, start-up, settings, image processing and camera interfaces.
    The PEN-F has the deepest coverage, with comparisons across E-M1, E-M5, E-M10, E-P7, OM-3 and OM-5
    models.'
  - 'It publishes a PEN-F HSL patch as alpha releases: hue and lightness added to the camera''s 12-colour
    saturation editor in COLOR1–3.'
  - The project asks for a firsthand hardware report before any flashable patch is merged or published;
    emulator and static checks alone are not enough.
