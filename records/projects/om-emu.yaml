  tagline: Run OM SYSTEM and Olympus camera firmware in your browser.
  description:
  - 'OM-Emu is a lab that runs Olympus and OM SYSTEM camera firmware outside the camera. It emulates the
    camera''s processor and the devices its screens depend on, then runs the firmware''s own menus and
    camera application. You can try it in your browser: you supply the official firmware file, and nothing
    is uploaded.'
  - Its reference body is the OM-1. Ports bring up the start screen, half-press, shutter and playback
    on many other bodies, including the OM-3, OM-5, OM-5 Mark II, E-M10 Mark IV, E-P7 and PEN-F. Firmware
    patches can be overlaid in memory, and Caduceus releases are checked in the lab before they go on
    a camera.
  - 'It is not a whole camera: the image sensor, autofocus and recording hardware are replaced by named
    stand-ins, so a result in the lab is not a result on a real camera.'
