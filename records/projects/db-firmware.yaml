    highlights:
    - Adds Hybrid Shutter on supported bodies, including the OM-3 and OM-5 Mark II.
    - The maintainer reports fixes for OM-5 Fn buttons, Wi-Fi, USB, vertical grip support and board-revision
      compatibility.
    - Adds 10 fps mechanical burst and S-OVF to the OM-5 build based on Mark II firmware.
    warning: The maintainer calls this a beta. The release notes give no test procedure or results for
      these changes.
