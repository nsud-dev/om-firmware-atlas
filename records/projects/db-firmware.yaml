  tagline: Feature patches across many OM SYSTEM and Olympus bodies, from aperture rings to new burst
    rates.
  description:
  - db firmware (om-c-firmware) by azqeurio publishes beta firmware patches for a wide range of bodies,
    including the OM-1, OM-1 Mark II, OM-3, OM-5, OM-5 Mark II, E-M1 Mark III, E-M5 Mark III and PEN-F.
    The repository's README is minimal; the release notes, partly in Korean, describe each version.
  - Recent releases list aperture-ring support for Panasonic lenses, extra burst rates on the OM-1, a
    5 GHz hotspot, the electronic shutter sound through the speaker, Korean menus and, in v0.4.1, a Quasi-LUT
    feature with transfer to the camera through DBLink.
  - The author owns only some of the supported bodies and says the patch can't be guaranteed to work on
    every model. v0.4.1 lists known issues for the OM-5 build.
  - The v0.4.2 beta notes list Hybrid Shutter for the OM-3 and OM-5 Mark II, and changes to the separate
    OM-5 build based on Mark II firmware.
