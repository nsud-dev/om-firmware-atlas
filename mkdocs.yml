site_name: OM Firmware Atlas
site_description: An independent map of Olympus and OM SYSTEM firmware research, modifications and evidence.
site_url: https://xulfr.github.io/om-firmware-atlas/
repo_url: https://github.com/xulfr/om-firmware-atlas
repo_name: Source repository
edit_uri: ''
theme:
  name: mkdocs
  custom_dir: overrides
  color_mode: light
  user_color_mode_toggle: false
  navigation_depth: 2
nav:
  - Home: index.md
  - Cameras: views/cameras/index.md
  - Projects: views/projects/index.md
  - Research: research.md
  - Knowledge: knowledge/README.md
  - Community: views/community/index.md
  - Contribute: contribute.md
  - How it works: how-it-works.md
  - About: about.md
plugins:
  - search
markdown_extensions:
  - tables
  - fenced_code
  - attr_list
  - md_in_html
  - toc:
      permalink: true
extra_css:
  - assets/atlas.css
validation:
  nav:
    omitted_files: ignore
  links:
    not_found: warn
    unrecognized_links: warn
