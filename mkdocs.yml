site_name: OM Firmware Atlas
site_description: An independent map of Olympus and OM SYSTEM firmware research, modifications and evidence.
site_url: https://xulfr.github.io/om-firmware-atlas/
repo_url: https://github.com/xulfr/om-firmware-atlas
repo_name: Source repository
edit_uri: ''
theme:
  name: mkdocs
  custom_dir: overrides
  color_mode: light
  user_color_mode_toggle: false
  navigation_depth: 2
nav:
  # The build expands the Cameras entry into per-line camera lists and the Guides entry into the
  # knowledge guides (scripts/atlas.py expand_nav), so neither list is maintained by hand.
  - Home: index.md
  - Cameras: views/cameras/index.md
  - Research:
      - Start here: research.md
      - Guides: knowledge/README.md
      - Catalogue:
          - Projects: views/projects/index.md
          - Firmware: views/firmware/index.md
          - Features: views/capabilities/index.md
          - Observations: views/evidence/index.md
          - Sources: views/sources/index.md
  - Get involved:
      - Overview: contribute.md
      - Talk: views/community/index.md
      - Report a result: report.md
      - Add or correct: add.md
  - About:
      - About the Atlas: about.md
      - Reading the evidence: evidence.md
      - How it works: how-it-works.md
plugins:
  - search
markdown_extensions:
  - tables
  - fenced_code
  - attr_list
  - md_in_html
  - toc:
      permalink: true
extra_css:
  - assets/atlas.css
validation:
  nav:
    omitted_files: ignore
  links:
    not_found: warn
    unrecognized_links: warn
